<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Jakarta';
        src: url('../../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        font-family: 'Jakarta', sans-serif;
        color: #fff;
        /* Footer gradient: black into brand navy */
        background: linear-gradient(180deg, #000 0%, #0d2240 45%, #1f487d 100%);
      }
      canvas {
        position: absolute;
        right: -170px;
        top: 40px;
        width: 1060px;
        height: 548px;
        -webkit-mask-image: radial-gradient(70% 75% at 62% 55%, #000 45%, transparent 100%);
      }
      .logo { position: absolute; left: 72px; top: 64px; height: 64px; }
      .badge {
        position: absolute; left: 72px; bottom: 228px;
        display: inline-flex; align-items: center; gap: 10px;
        padding: 6px 14px; border-radius: 20px;
        background: rgb(255 255 255 / 0.1); border: 1px solid rgb(255 255 255 / 0.18);
        font-size: 15px; letter-spacing: 1.2px; text-transform: uppercase;
      }
      .badge i { width: 8px; height: 8px; border-radius: 50%; background: #f77335; box-shadow: 0 0 0 4px rgb(247 115 53 / 0.25); }
      h1 {
        position: absolute; left: 68px; bottom: 64px;
        font-size: 76px; line-height: 1.08; font-weight: 700; letter-spacing: -2.4px;
      }
      h1 span { color: #a9bdd8; }
      .meta {
        position: absolute; right: 72px; bottom: 72px;
        font-size: 17px; color: rgb(255 255 255 / 0.6); text-align: right; line-height: 1.6;
      }
      .meta b { color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas width="2120" height="1096"></canvas>
    <img class="logo" src="../../public/assets/logo/bmk-white.svg" alt="" />
    <p class="badge"><i></i>Global technology distribution</p>
    <h1>Built on trust.<br /><span>Driven by innovation.</span></h1>
    <p class="meta"><b>24</b> years · <b>6</b> countries · <b>8</b> companies</p>
    <script type="module">
      // The homepage's dotted world map in the lighter brand blue, with orange
      // pins on BMK's six locations (positions from src/data/locations.js).
      const map = await (await fetch('../../src/data/map-dots.json')).json();
      const pins = [[60.42, 47.1], [68.0, 59.2], [77.33, 62.74], [75.7, 60.16], [54.75, 72.7], [51.1, 65.4]];
      const c = document.querySelector('canvas');
      const ctx = c.getContext('2d');
      const s = c.width / map.w;
      ctx.scale(s, s);
      ctx.fillStyle = '#628abf';
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      for (let i = 0; i < map.dots.length; i += 2) {
        ctx.moveTo(map.dots[i] + map.r, map.dots[i + 1]);
        ctx.arc(map.dots[i], map.dots[i + 1], map.r, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
      for (const [x, y] of pins) {
        const px = (x / 100) * map.w;
        const py = (y / 100) * map.h;
        ctx.fillStyle = 'rgb(247 115 53 / 0.25)';
        ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f77335';
        ctx.beginPath(); ctx.arc(px, py, 4.2, 0, Math.PI * 2); ctx.fill();
      }
      await document.fonts.ready;
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
